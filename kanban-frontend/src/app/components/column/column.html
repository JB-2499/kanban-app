<div class="column">
  <h2>{{ title }}</h2>
  <div class="tasks">
    @for (task of tasks; track task.id) {
      <app-task-card [task]="task" (statusChanged)="onStatusChanged($event)" />
    }

    @if (!showForm) {
      <button class="add-btn" (click)="showForm = true">+ Adicionar</button>
    }

    @if (showForm) {
      <div class="form">
        <input 
          type="text" 
          placeholder="Título da tarefa"
          [(ngModel)]="newTitle" 
        />
        <input 
          type="text" 
          placeholder="Descrição (opcional)"
          [(ngModel)]="newDescription" 
        />
        <div class="form-buttons">
          <button (click)="addTask()">Adicionar</button>
          <button (click)="showForm = false">Cancelar</button>
        </div>
      </div>
    }
  </div>
</div>
